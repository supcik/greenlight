<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenlight</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body
    class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-cyan-400/30 selection:text-cyan-100"
  >
    <div
      class="outerContainer flex min-h-screen w-full items-center justify-center px-4 py-8"
    >
      <div
        class="w-full max-w-lg rounded-2xl border border-cyan-400/20 bg-slate-900/75 p-7 text-center shadow-[0_0_70px_-25px_rgba(34,211,238,0.45)] backdrop-blur"
      >
        <p class="text-sm font-medium tracking-wide text-slate-200">
          Waiting for the server to become available...
        </p>
        <div
          class="mt-4 break-all rounded-lg border border-cyan-300/20 bg-slate-950/70 px-3 py-2 font-mono text-xs text-cyan-300"
          id="urlDisplay"
        >
          Parsing query...
        </div>
        <div id="status" class="mt-5 text-sm text-slate-400">Connecting...</div>
        <div
          id="loader"
          class="mx-auto mt-4 h-8 w-8 rounded-full border-4 border-cyan-300/25 border-t-cyan-300 animate-spin"
          style="display: none"
        ></div>
      </div>
    </div>
    <script type="module" src="/src/poller.ts"></script>
  </body>
</html>
